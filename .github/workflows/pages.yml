name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskal-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install isolated web dependencies
        run: npm ci --prefix apps/web --ignore-scripts
      - name: Audit isolated web dependencies
        run: npm audit --prefix apps/web
      - name: Typecheck
        run: npm run web:typecheck
      - name: Test
        run: npm run web:test
      - name: Build canonical project site
        env:
          DESKAL_WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run web:build
      - name: Verify exported project paths
        shell: bash
        run: |
          test "${{ steps.pages.outputs.base_path }}" = "/Deskal"
          test -f apps/web/out/index.html
          test -f apps/web/out/brand/deskal-mark-mask.svg
          grep -Fq '/Deskal/_next/' apps/web/out/index.html
          grep -Fq '/Deskal/brand/deskal-mark-mask.svg' apps/web/out/index.html
          test ! -e apps/web/public/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify published site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: HTTPS smoke test
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          case "$PAGE_URL" in
            https://thehalfmoon.github.io/Deskal/|https://thehalfmoon.github.io/Deskal) ;;
            *) echo "unexpected Pages URL: $PAGE_URL" >&2; exit 1 ;;
          esac

          page="${PAGE_URL%/}/"
          asset="${PAGE_URL%/}/brand/deskal-mark-mask.svg"

          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 15 "$page" -o "$RUNNER_TEMP/index.html" &&
               curl --fail --location --silent --show-error --max-time 15 "$asset" -o "$RUNNER_TEMP/deskal-mark-mask.svg"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pages smoke test did not become healthy" >&2
              exit 1
            fi
            sleep 5
          done

          grep -Fq 'Deskal' "$RUNNER_TEMP/index.html"
          grep -Fq 'https://github.com/TheHalfMoon/Deskal/releases' "$RUNNER_TEMP/index.html"
          grep -Fq '<svg' "$RUNNER_TEMP/deskal-mark-mask.svg"
