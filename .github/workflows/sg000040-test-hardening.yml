name: SG-000040 Acceptance Test Hardening

on:
  push:
    branches:
      - feat/sg-000040-network-fetch

permissions:
  contents: write

concurrency:
  group: sg000040-test-hardening
  cancel-in-progress: false

jobs:
  harden-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000040-network-fetch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Add digest-binding coverage, format, test, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/cotrad/src/git_fetch.rs')
          text = path.read_text()
          marker = 'mod network_binding_tests {'
          if marker in text:
              raise SystemExit('network binding tests already present unexpectedly')
          addition = r'''

#[cfg(test)]
mod network_binding_tests {
    use super::*;
    use cotra_contracts::INTERNAL_PROTOCOL_VERSION;
    use serde_json::json;
    use std::path::PathBuf;

    fn workspace(id: &str) -> Workspace {
        Workspace {
            id: id.to_owned(),
            root: PathBuf::from("."),
        }
    }

    fn request(workspace_id: &str, url: &str) -> RequestEnvelope {
        RequestEnvelope {
            version: INTERNAL_PROTOCOL_VERSION,
            request_id: "binding".into(),
            client_session_id: "session".into(),
            workspace_id: workspace_id.into(),
            capability: "network".into(),
            operation: "fetch".into(),
            target: None,
            arguments: json!({"url": url}),
        }
    }

    fn prepared(url: &str, address: &str) -> cotra_provider_network::PreparedFetch {
        let address = address.parse().unwrap();
        cotra_provider_network::PreparedFetch {
            target: cotra_provider_network::parse_target(url).unwrap(),
            addresses: vec![address],
            address_set_digest: cotra_provider_network::address_set_digest(&[address]),
        }
    }

    #[test]
    fn network_approval_digest_binds_workspace_operation_path_and_address_set() {
        let base_workspace = workspace("default");
        let base_request = request("default", "https://example.com/a");
        let base_prepared = prepared("https://example.com/a", "8.8.8.8");
        let base = network_digest(&base_workspace, &base_request, &base_prepared);

        assert_ne!(
            base,
            network_digest(
                &workspace("other"),
                &request("other", "https://example.com/a"),
                &base_prepared,
            )
        );
        assert_ne!(
            base,
            network_digest(
                &base_workspace,
                &request("default", "https://example.com/b"),
                &prepared("https://example.com/b", "8.8.8.8"),
            )
        );
        assert_ne!(
            base,
            network_digest(
                &base_workspace,
                &base_request,
                &prepared("https://example.com/a", "1.1.1.1"),
            )
        );

        let mut wrong_operation = base_request.clone();
        wrong_operation.operation = "connect".into();
        assert_ne!(
            base,
            network_digest(&base_workspace, &wrong_operation, &base_prepared)
        );
    }
}
'''
          path.write_text(text + addition)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          git diff --check
          git rm .github/workflows/sg000040-test-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No hardening changes produced"; exit 1; } || true
          git commit -m "test: harden SG-000040 approval binding coverage"
          git push origin HEAD:feat/sg-000040-network-fetch
