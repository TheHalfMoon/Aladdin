name: Release

# Builds, packages, and qualifies a Windows x64 release from a version tag and
# attaches it to a draft GitHub Release. Publishing the draft is a deliberate
# maintainer action. Artifacts are unsigned (no paid code-signing certificate);
# integrity is enforced by manifest verification at install and update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release / windows-latest
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Require the tag to match the workspace version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match workspace version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build release binaries and the MCP app
        run: |
          npm install --ignore-scripts
          npm run build
          cargo build --release -p cotrad -p cotra-lifecycle --bins --examples
      - name: Package release
        run: node scripts/package-release.mjs --out "${{ runner.temp }}/cotra-${{ env.VERSION }}-windows-x64"
      - name: Qualify the packaged release
        env:
          COTRA_RELEASE_DIR: ${{ runner.temp }}/cotra-${{ env.VERSION }}-windows-x64
        run: cargo test --release -p cotra-lifecycle --test release_qualification -- --ignored --nocapture
      - name: Archive and hash
        shell: pwsh
        run: |
          $name = "cotra-$env:VERSION-windows-x64"
          $out = Join-Path $env:RUNNER_TEMP "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP "$name\*") -DestinationPath (Join-Path $out "$name.zip")
          Copy-Item (Join-Path $env:RUNNER_TEMP "$name\manifest.json") (Join-Path $out "$name.manifest.json")
          Get-ChildItem $out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File (Join-Path $out "SHA256SUMS.txt") -Encoding ascii
          Get-Content (Join-Path $out "SHA256SUMS.txt")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "dist"
          gh release create "${{ github.ref_name }}" (Get-ChildItem $out -File).FullName --draft --verify-tag --repo "${{ github.repository }}" --title "Cotra $env:VERSION" --notes "Unsigned Windows x64 build of Cotra $env:VERSION from ${{ github.sha }}. Verify the archive against SHA256SUMS.txt; the installer verifies every payload file against manifest.json."
