name: Bug report
description: Report a reproducible Orcel problem (not a vulnerability).
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Orcel. **Do not include tokens, private paths, sensitive data, or unredacted logs.** For vulnerabilities, use [private reporting](https://github.com/TheHalfMoon/Orcel/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Orcel version or commit
      description: Give the release version or Git commit SHA.
      placeholder: "v0.x or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      description: For installed clients, include Windows version/build and client/transport.
      placeholder: "Windows 11 x64; MCP stdio"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal, sanitized reproduction. Never paste credentials.
      placeholder: "1. Configure a test workspace... 2. Run... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics and relevant checks
      description: Include orcel doctor results, relevant test command, and errors after redaction.
      render: text
    validations:
      required: false
