name: Qdral rename rustfmt repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rustfmt-repair:
    if: github.head_ref == 'identity/quntal-to-qdral' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format Rust tree
        run: cargo fmt --all
      - name: Commit formatting only
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check
          git add crates
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply rustfmt after Qdral rename'
          git push origin "HEAD:${HEAD_REF}"
