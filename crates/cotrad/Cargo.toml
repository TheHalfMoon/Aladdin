cotra-provider-fs = { path = "../cotra-provider-fs" }
cotra-provider-git = { path = "../cotra-provider-git" }
cotra-provider-process = { path = "../cotra-provider-process" }
cotra-provider-uia = { path = "../cotra-provider-uia" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
cotra-approval = { path = "../cotra-approval", features = ["test-support"] }
