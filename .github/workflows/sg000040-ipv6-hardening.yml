name: SG-000040 IPv6 Public-Only Hardening

on:
  push:
    branches:
      - feat/sg-000040-network-fetch

permissions:
  contents: write

concurrency:
  group: sg000040-ipv6-hardening
  cancel-in-progress: false

jobs:
  harden:
    name: Deny non-global IPv6 special-purpose ranges and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000040-network-fetch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Harden exact public-only IPv6 policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/cotra-provider-network/src/lib.rs')
          text = path.read_text()

          start = text.index('fn is_public_ipv6(value: &Ipv6Addr) -> bool {')
          end = text.index('\npub fn address_set_digest', start)
          new_fn = '''fn is_public_ipv6(value: &Ipv6Addr) -> bool {
              if value.is_loopback() || value.is_unspecified() || value.is_multicast() {
                  return false;
              }
              if let Some(mapped) = value.to_ipv4_mapped() {
                  return is_public_ipv4(&mapped);
              }
              if value.to_ipv4().is_some() {
                  return false;
              }

              let segments = value.segments();
              // IANA currently allocates native IPv6 global unicast from 2000::/3.
              // Everything outside that allocation ceiling fails closed. Within it,
              // deny special-purpose and reserved blocks relevant to this authority.
              if (segments[0] & 0xe000) != 0x2000 {
                  return false;
              }
              if (segments[0] == 0x2001 && segments[1] == 0x0000)
                  || (segments[0] == 0x2001 && segments[1] == 0x0001)
                  || (segments[0] == 0x2001 && segments[1] == 0x0002)
                  || (segments[0] == 0x2001 && segments[1] == 0x0db8)
                  || segments[0] == 0x2002
                  || (segments[0] & 0xff00) == 0x3f00
              {
                  return false;
              }
              true
          }
          '''
          text = text[:start] + new_fn + text[end:]

          needle = '            "::ffff:127.0.0.1",'
          if text.count(needle) != 1:
              raise SystemExit('failed to locate mapped-private test exactly once')
          expanded = '''            "fec0::1",
              "64:ff9b:1::1",
              "100::1",
              "100:0:0:1::1",
              "3fff::1",
              "5f00::1",
              "4000::1",
              "::ffff:127.0.0.1",'''
          text = text.replace(needle, expanded, 1)

          needle = '        assert!(is_public_address(&public()));'
          if text.count(needle) != 1:
              raise SystemExit('failed to locate public-address positive test exactly once')
          text = text.replace(
              needle,
              needle + '\n        assert!(is_public_address(&"2001:4860:4860::8888".parse().unwrap()));',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          git diff --check
          git rm .github/workflows/sg000040-ipv6-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No hardening changes produced"; exit 1; } || true
          git commit -m "fix: harden SG-000040 public IPv6 filtering"
          git push origin HEAD:feat/sg-000040-network-fetch
