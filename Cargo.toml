[workspace]
resolver = "2"
members = [
  "crates/quntal-contracts",
  "crates/quntal-policy",
  "crates/quntal-audit",
  "crates/quntal-approval",
  "crates/quntal-provider-fs",
  "crates/quntal-provider-git",
  "crates/quntal-provider-process",
  "crates/quntal-provider-browser",
  "crates/quntal-provider-uia",
  "crates/quntal-provider-clipboard",
  "crates/quntal-provider-network",
  "crates/quntal-tunnel",
  "crates/quntal-lifecycle",
  "crates/quntald",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Quntal"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
