name: SG-000040 Canonical Closeout Builder

on:
  push:
    branches:
      - chore/close-sg-000040

permissions:
  contents: write

jobs:
  build-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/close-sg-000040
          fetch-depth: 0
      - name: Build canonical closeout files
        run: python .github/scripts/sg000040_closeout.py
      - name: Validate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool .specgrain/specs/SG-000040.json >/dev/null
          python -m json.tool .specgrain/canonical-evidence.json >/dev/null
          grep -q '^Status: CLOSED_CANONICAL$' docs/canonical/CURRENT.md
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain/specs/SG-000040.json .specgrain/canonical-evidence.json docs/canonical/CURRENT.md
          git commit -m "chore: close SG-000040 canonically"
          git rm .github/workflows/sg000040-closeout-builder.yml .github/scripts/sg000040_closeout.py
          git commit -m "ci: remove SG-000040 closeout builder"
          git push origin HEAD:chore/close-sg-000040
