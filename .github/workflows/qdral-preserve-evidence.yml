name: Qdral preserve historical P16 evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  preserve-evidence:
    if: github.head_ref == 'identity/quntal-to-qdral' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore immutable SG-000066 evidence and adapt current verifier
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6013ada69ea9c5c0ab9174391f1cc4c36408504e -- docs/p16/sg000066_exit_evidence.json
          python - <<'PY'
          from pathlib import Path

          test = Path('apps/qdral-mcp/src/p16-exit.test.ts')
          text = test.read_text(encoding='utf-8')
          current_schema = 'assert.equal(evidence.schema, "qdral-p16-exit-evidence/2");'
          historical_schema = 'assert.equal(evidence.schema, "quntal-p16-exit-evidence/2");'
          if current_schema not in text and historical_schema not in text:
              raise SystemExit('evidence schema assertion not found')
          text = text.replace(current_schema, historical_schema)

          test_marker = 'test("every qualification artifact in the exit manifest exists", () => {'
          test_start = text.index(test_marker)
          loop_start = text.index('  for (const path of paths) {', test_start)
          loop_end = text.index('\n  }\n});', loop_start) + len('\n  }')
          replacement = '''  for (const historicalPath of paths) {
            const currentPath = historicalPath
              .replace(/^apps\\/quntal-mcp\\//, "apps/qdral-mcp/")
              .replace(/^crates\\/quntald\\//, "crates/qdrald/");
            const absolute = join(repo, currentPath);
            assert.ok(existsSync(absolute), `missing current qualification artifact for historical ${historicalPath}: ${currentPath}`);
            assert.ok(statSync(absolute).isFile(), `qualification artifact is not a file ${currentPath}`);
          }'''
          text = text[:loop_start] + replacement + text[loop_end:]
          test.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-current-identity.mjs')
          text = gate.read_text(encoding='utf-8')
          evidence_line = '  path === "docs/p16/sg000066_exit_evidence.json" ||\n'
          if evidence_line not in text:
              needle = '  path === "docs/canonical/CURRENT.md" ||\n'
              if needle not in text:
                  raise SystemExit('identity allowlist insertion point not found')
              text = text.replace(needle, needle + evidence_line, 1)
          gate.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit evidence-preservation repair
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add docs/p16/sg000066_exit_evidence.json apps/qdral-mcp/src/p16-exit.test.ts scripts/check-current-identity.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: preserve historical P16 evidence across Qdral rename'
          git push origin "HEAD:${HEAD_REF}"
