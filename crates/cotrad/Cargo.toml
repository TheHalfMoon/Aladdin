[package]
name = "cotrad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "cotrad"
path = "src/sg000039_main.rs"

[dependencies]
cotra-approval = { path = "../cotra-approval" }
cotra-audit = { path = "../cotra-audit" }
cotra-contracts = { path = "../cotra-contracts" }
cotra-policy = { path = "../cotra-policy" }
cotra-provider-browser = { path = "../cotra-provider-browser" }
cotra-provider-clipboard = { path = "../cotra-provider-clipboard" }
cotra-provider-fs = { path = "../cotra-provider-fs" }
cotra-provider-git = { path = "../cotra-provider-git" }
cotra-provider-network = { path = "../cotra-provider-network" }
cotra-provider-process = { path = "../cotra-provider-process" }
cotra-provider-uia = { path = "../cotra-provider-uia" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[dev-dependencies]
cotra-approval = { path = "../cotra-approval", features = ["test-support"] }
