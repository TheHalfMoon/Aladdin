[package]
name = "quntald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "quntald"
path = "src/sg000039_main.rs"

[dependencies]
quntal-approval = { path = "../quntal-approval" }
quntal-audit = { path = "../quntal-audit" }
quntal-contracts = { path = "../quntal-contracts" }
quntal-policy = { path = "../quntal-policy" }
quntal-provider-browser = { path = "../quntal-provider-browser" }
quntal-provider-clipboard = { path = "../quntal-provider-clipboard" }
quntal-provider-fs = { path = "../quntal-provider-fs" }
quntal-provider-git = { path = "../quntal-provider-git" }
quntal-provider-network = { path = "../quntal-provider-network" }
quntal-provider-process = { path = "../quntal-provider-process" }
quntal-provider-uia = { path = "../quntal-provider-uia" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[dev-dependencies]
quntal-approval = { path = "../quntal-approval", features = ["test-support"] }
