name: SG-000040 IPv6 Public-Only Hardening

on:
  push:
    branches:
      - feat/sg-000040-network-fetch

permissions:
  contents: write

concurrency:
  group: sg000040-ipv6-hardening
  cancel-in-progress: false

jobs:
  harden:
    name: Deny non-global IPv6 special-purpose ranges and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sg-000040-network-fetch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Harden exact public-only IPv6 policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/cotra-provider-network/src/lib.rs')
          text = path.read_text()

          old = '''    if (segments[0] & 0xffc0) == 0xfe80
              || (segments[0] & 0xfe00) == 0xfc00
              || (segments[0] == 0x2001 && segments[1] == 0x0db8)
              || (segments[0] == 0x2001 && segments[1] == 0x0002)
              || (segments[0] == 0x2001 && segments[1] == 0x0001)
              || segments[0] == 0x2002
              || (segments[0] == 0x0064 && (segments[1] & 0xffc0) == 0xff00)
              || (value.octets()[0] == 0 && value.octets()[1] == 0)
          {'''
          new = '''    if (segments[0] & 0xffc0) == 0xfe80
              || (segments[0] & 0xfe00) == 0xfc00
              || (segments[0] & 0xffc0) == 0xfec0
              || (segments[0] == 0x0064 && (segments[1] & 0xffc0) == 0xff00)
              || (segments[0] == 0x0100 && segments[1] == 0 && segments[2] == 0 && segments[3] <= 1)
              || (segments[0] == 0x2001 && segments[1] == 0x0db8)
              || (segments[0] == 0x2001 && segments[1] == 0x0002)
              || (segments[0] == 0x2001 && segments[1] == 0x0001)
              || segments[0] == 0x2002
              || (segments[0] & 0xfff0) == 0x3ff0
              || segments[0] == 0x5f00
              || (value.octets()[0] == 0 && value.octets()[1] == 0)
          {'''
          if text.count(old) != 1:
              raise SystemExit('failed to locate IPv6 special-purpose filter exactly once')
          text = text.replace(old, new, 1)

          old = '''            "fc00::1",
              "fe80::1",
              "2001:db8::1",
              "::ffff:127.0.0.1",'''
          new = '''            "fc00::1",
              "fe80::1",
              "fec0::1",
              "64:ff9b:1::1",
              "100::1",
              "100:0:0:1::1",
              "2001:db8::1",
              "3fff::1",
              "5f00::1",
              "::ffff:127.0.0.1",'''
          if text.count(old) != 1:
              raise SystemExit('failed to locate dangerous-address test catalog exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          git diff --check
          git rm .github/workflows/sg000040-ipv6-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "No hardening changes produced"; exit 1; } || true
          git commit -m "fix: harden SG-000040 public IPv6 filtering"
          git push origin HEAD:feat/sg-000040-network-fetch
